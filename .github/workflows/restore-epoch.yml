name: restore-epoch
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/epoch.html.zlib.b64'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and commit epoch.html
        run: |
          python3 - <<'PY'
          import base64, zlib, pathlib
          b = pathlib.Path('tools/epoch.html.zlib.b64').read_text().strip()
          data = zlib.decompress(base64.b64decode(b))
          pathlib.Path('epoch.html').write_bytes(data)
          print('wrote', len(data))
          assert b'btnEpochModern' in data and b'obliquityDeg' in data and b'initEpochUi' in data
          PY
          git config user.name "Tim Daw"
          git config user.email "tim.daw@gmail.com"
          git add epoch.html
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "epoch.html: Modern/2500 BC sun-moon; title Stonehenge 3D Model"
          git push
