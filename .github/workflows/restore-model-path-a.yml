name: restore-model-path-a
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/model_path_a.p0.b64'
      - 'tools/model_path_a.p1.b64'
      - 'tools/model_path_a.p2.b64'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and commit model_path_a.html
        run: |
          python3 - <<'PY'
          import base64, zlib, pathlib
          parts = [pathlib.Path(f'tools/model_path_a.p{i}.b64').read_text().strip() for i in range(3)]
          data = zlib.decompress(base64.b64decode(''.join(parts)))
          pathlib.Path('model_path_a.html').write_bytes(data)
          print('wrote', len(data))
          assert b'pathASunFromSample' in data
          assert b'Path A preview' in data
          assert b'pathABanner' in data
          assert data.count(b'function approxSun(d, mode)') == 1
          assert data[:15] == b'<!DOCTYPE html>'
          PY
          git config user.name "Tim Daw"
          git config user.email "tim.daw@gmail.com"
          git add model_path_a.html
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "model_path_a.html: Path A / Hoyle sky preview (replace stub)"
          git push
          git rm -f tools/model_path_a.p0.b64 tools/model_path_a.p1.b64 tools/model_path_a.p2.b64 .github/workflows/restore-model-path-a.yml 2>/dev/null || true
          git commit -m "chore: remove model_path_a restore staging" || true
          git push || true
