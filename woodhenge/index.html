<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Woodhenge</title>
<style>
 html,body{margin:0;height:100%;background:#071018;color:#eee;font:13px/1.35 system-ui,sans-serif;overflow:hidden}
 #c{position:fixed;inset:0;width:100%;height:100%;display:block}
 #hudToggle{position:fixed;left:10px;top:10px;z-index:4;min-width:44px;min-height:44px;
  padding:8px 12px;border:0;border-radius:8px;background:rgba(10,16,24,.92);color:#e8d9a8;
  font:600 13px system-ui,sans-serif;cursor:pointer}
 #hud{position:fixed;left:10px;top:58px;width:260px;max-width:calc(100% - 20px);max-height:calc(100% - 70px);overflow:auto;
  background:rgba(10,16,24,.9);padding:10px 12px;border-radius:8px;z-index:2}
 #hud.collapsed{display:none}
 @media (min-width:701px){
  #hud{top:10px}
  #hudToggle{display:none}
  #hud.collapsed{display:block}
 }
 button,label,input{font:inherit}
 button{margin:3px 4px 0 0;padding:4px 8px;border:0;border-radius:4px;background:#243044;color:#eee;cursor:pointer}
 button.active{background:#c45c26}
 label.t{display:block;margin:8px 0 2px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;opacity:.75}
 .chk{display:flex;align-items:center;gap:6px;margin:3px 0}
 .swatch{width:10px;height:10px;border-radius:2px;display:inline-block}
 #readout{margin-top:8px;font-size:12px;line-height:1.4}
 .note{opacity:.75;font-size:11px;margin:2px 0 6px}
 input[type=range]{width:100%}
 @media (max-width:700px){
  #hud button{min-height:36px;padding:6px 10px}
 }
</style>
</head>
<body>
<div id="c"></div>
<button type="button" id="hudToggle" aria-expanded="true" aria-controls="hud" title="Show or hide controls">Controls ▾</button>
<div id="hud">
  <div><b>Woodhenge</b></div>
  <label class="t">Rings</label>
  <div id="rings"></div>
  <label class="t">Height <span id="hLbl">7.5 m</span></label>
  <input type="range" id="postH" min="1" max="12" step="0.1" value="7.5"/>
  <label class="t">Sky</label>
  <div class="row">
    <button type="button" id="btnSunOff">Off</button>
    <button type="button" id="btnSunrise" class="active">Sunrise</button>
    <button type="button" id="btnSunset">Sunset</button>
    <button type="button" id="btnMoonrise">Moonrise</button>
    <button type="button" id="btnMoonset">Moonset</button>
  </div>
  <label class="t">Limb</label>
  <div class="row">
    <button type="button" id="btnLimbGleam" class="active">Gleam</button>
    <button type="button" id="btnLimbHalf">Half orb</button>
    <button type="button" id="btnLimbFull">Full orb</button>
  </div>
  <div class="chk"><label><input type="checkbox" id="starsOn" checked/> Stars <span id="starNote"></span></label></div>
  <label class="t">Epoch</label>
  <div class="row">
    <button type="button" id="btnEpochModern" class="active">Modern</button>
    <button type="button" id="btnEpoch2500">2500 BC</button>
    <input type="number" id="epochYear" value="2026" step="1" aria-label="Year" style="width:5.4em;margin-top:3px;padding:4px 6px;border:0;border-radius:4px;background:#243044;color:#eee"/>
  </div>
  <label class="t">Date <span id="doyLbl">21 Jun</span></label>
  <input type="range" id="doy" min="1" max="365" value="172"/>
  <div class="row">
    <button type="button" data-doy="80">21 Mar</button>
    <button type="button" data-doy="172">21 Jun</button>
    <button type="button" data-doy="266">23 Sep</button>
    <button type="button" data-doy="355">21 Dec</button>
  </div>
  <label class="t">Time <span id="utLbl">03:57 UT</span></label>
  <input type="range" id="utMin" min="0" max="2160" step="1" value="237"/>
  <div class="row">
    <button type="button" id="btnDaySun">Sun's arc</button>
    <button type="button" id="btnDayMoon">Moon's arc</button>
    <button type="button" id="btnSkyPlay">Pause</button>
  </div>
  <div class="chk"><label><input type="checkbox" id="showSunRay" checked/> Sun ray</label></div>
  <label class="t">Axes (true azimuth)</label>
  <div class="chk"><label><input type="checkbox" id="axisCun" checked/> <i class="swatch" style="background:#ffffff"></i> Cunnington's line, 49.4°</label></div>
  <div class="chk"><label><input type="checkbox" id="axisCF" checked/> <i class="swatch" style="background:#3fd08a"></i> Fitted axis, rings C–F, 43.3°</label></div>
  <div class="chk"><label><input type="checkbox" id="axisAB" checked/> <i class="swatch" style="background:#ff8a3d"></i> Fitted axis, rings A–B, 38.6°</label></div>
  <div class="row">
    <button type="button" id="btnEye">Eye at centre, facing 49.4°</button>
    <button type="button" id="btnTop">Plan view</button>
  </div>
  <div id="readout">Loading landscape…</div>
</div>
<script src="./posts.js"></script>
<script src="../data/bright_stars.js"></script>
<script src="./horizon.js"></script>
<script src="./avon.js"></script>
<script type="importmap">
{"imports":{"three":"../vendor/three.module.js","three/addons/":"../vendor/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/OrbitControls.js';
import * as Sky from '../skyscape_sky.js';
import { starHorizontal, starsAbove } from '../stars_sky.js';

const hudEl = document.getElementById('hud');
const hudToggle = document.getElementById('hudToggle');
function isNarrow() { return window.matchMedia('(max-width: 700px)').matches; }
function setHudOpen(open) {
  hudEl.classList.toggle('collapsed', !open);
  hudToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  hudToggle.textContent = open ? 'Controls ▾' : 'Controls ▸';
  try { sessionStorage.setItem('wh_hud_open', open ? '1' : '0'); } catch (e) {}
}
(function initHud() {
  let open;
  try {
    const stored = sessionStorage.getItem('wh_hud_open');
    open = (stored === '0' || stored === '1') ? stored === '1' : !isNarrow();
  } catch (e) { open = !isNarrow(); }
  setHudOpen(open);
  hudToggle.addEventListener('click', () => {
    setHudOpen(hudToggle.getAttribute('aria-expanded') !== 'true');
  });
})();

const CE = 412245.35, CN = 142194.11;
const P = window.WOODHENGE_POSTS;
const RING_COLOUR = {
  A: 0xc45a1e, B: 0xd4a017, C: 0x2f8f55, D: 0x3d6ea8, E: 0x7a4ea3, F: 0xc43b4a, '?': 0xf4f0e6,
};

function localXZ(e, n) { return { x: e - CE, z: -(n - CN) }; }

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('c').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x071018);
const cam = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.4, 140000);
const controls = new OrbitControls(cam, renderer.domElement);
controls.maxPolarAngle = Math.PI * 0.49;
controls.maxDistance = 24000;
const centre = localXZ(P.centre.e, P.centre.n);
cam.position.set(centre.x, 80, centre.z + 70);
controls.target.set(centre.x, 0, centre.z);

const hemi = new THREE.HemisphereLight(0xc9d4e8, 0x3d4a3a, 0.55);
scene.add(hemi);
const sunLight = new THREE.DirectionalLight(0xffe2a8, 1.35);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.near = 10;
sunLight.shadow.camera.far = 900;
sunLight.shadow.camera.left = -80;
sunLight.shadow.camera.right = 80;
sunLight.shadow.camera.top = 80;
sunLight.shadow.camera.bottom = -80;
sunLight.shadow.bias = -0.0004;
scene.add(sunLight);
scene.add(sunLight.target);

const skyDome = new THREE.Mesh(
  new THREE.SphereGeometry(90000, 48, 32),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    toneMapped: false,
    uniforms: {
      sunAlt: { value: 20 },
      sunDir: { value: new THREE.Vector3(0, 0.3, -1) },
      eyePos: { value: new THREE.Vector3() },
    },
    vertexShader: `
      varying vec3 vWorld;
      void main() {
        vec4 w = modelMatrix * vec4(position, 1.0);
        vWorld = w.xyz;
        gl_Position = projectionMatrix * viewMatrix * w;
      }
    `,
    fragmentShader: `
      varying vec3 vWorld;
      uniform float sunAlt;
      uniform vec3 sunDir;
      uniform vec3 eyePos;
      void main() {
        vec3 dir = normalize(vWorld - eyePos);
        float alt = degrees(asin(clamp(dir.y, -1.0, 1.0)));
        float day = smoothstep(2.0, 16.0, sunAlt);
        float dawn = smoothstep(-3.5, 0.8, sunAlt) * (1.0 - smoothstep(3.0, 9.0, sunAlt));
        vec3 zenith = mix(vec3(0.012, 0.016, 0.04), vec3(0.13, 0.32, 0.58), day);
        vec3 horiz = mix(vec3(0.025, 0.032, 0.06), vec3(0.40, 0.52, 0.64), day);
        horiz = mix(horiz, vec3(0.32, 0.14, 0.08), dawn * 0.7);
        float h = smoothstep(22.0, -1.0, alt);
        vec3 col = mix(zenith, horiz, h);
        float glow = pow(max(dot(dir, normalize(sunDir)), 0.0), 48.0) * smoothstep(-2.0, 1.5, sunAlt);
        col += vec3(1.0, 0.72, 0.38) * glow * 0.35;
        gl_FragColor = vec4(col, 1.0);
      }
    `,
  })
);
skyDome.frustumCulled = false;
skyDome.renderOrder = -2;
scene.add(skyDome);

// Same star points as the Stonehenge page. Directions come from stars_sky
// (x east, y up, z minus north). Drawn from this site: the Stonehenge page
// can leave them on the origin because the camera is there.
const STAR_R = 20000;
let starsOn = true;
let starKey = '';
const starGeo = new THREE.BufferGeometry();
const starMat = new THREE.ShaderMaterial({
  uniforms: { sunAlt: { value: -10 } },
  vertexShader: `
    attribute float mag;
    varying float vMag;
    void main() {
      vMag = mag;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = clamp(7.0 - mag, 1.6, 8.0);
    }
  `,
  fragmentShader: `
    varying float vMag;
    uniform float sunAlt;
    void main() {
      float r = length(gl_PointCoord - 0.5);
      if (r > 0.5) discard;
      float a = smoothstep(0.5, 0.12, r);
      float night = 1.0 - smoothstep(-6.0, 4.0, sunAlt);
      float bright = clamp((6.2 - vMag) / 5.2, 0.45, 1.0);
      gl_FragColor = vec4(0.96, 0.97, 1.0, a * bright * night);
    }
  `,
  transparent: true,
  depthWrite: false,
  depthTest: true,
  fog: false,
});
const starPoints = new THREE.Points(starGeo, starMat);
starPoints.frustumCulled = false;
starPoints.renderOrder = 1;
starPoints.visible = false;
starPoints.position.set(centre.x, 0, centre.z);
scene.add(starPoints);

const rings = {};
const posts = [];
const ringBox = document.getElementById('rings');
const counts = {};
for (const hole of P.posts) counts[hole.ring || '?'] = (counts[hole.ring || '?'] || 0) + 1;
for (const ring of [...'ABCDEF', '?']) {
  if (!counts[ring]) continue;
  const g = new THREE.Group();
  g.name = ring;
  rings[ring] = g;
  scene.add(g);
  const label = ring === '?' ? 'Other' : ring;
  const row = document.createElement('div');
  row.className = 'chk';
  row.innerHTML = '<input type="checkbox" checked data-ring="' + ring + '"/>'
    + '<i class="swatch" style="background:#' + RING_COLOUR[ring].toString(16).padStart(6, '0') + '"></i> '
    + label + ' (' + counts[ring] + ')';
  ringBox.appendChild(row);
  row.querySelector('input').onchange = (ev) => { g.visible = ev.target.checked; };
}
const mats = {};
for (const ring of Object.keys(RING_COLOUR)) {
  mats[ring] = new THREE.MeshLambertMaterial({ color: RING_COLOUR[ring] });
}
for (const hole of P.posts) {
  const ring = hole.ring || '?';
  const p = localXZ(hole.e, hole.n);
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 3, 12), mats[ring]);
  mesh.castShadow = true;
  mesh.position.set(p.x, 1.5, p.z);
  mesh.userData.en = { e: hole.e, n: hole.n };
  mesh.userData.ring = ring;
  (rings[ring] || scene).add(mesh);
  posts.push(mesh);
}

// Grid convergence at Woodhenge: true azimuth = OSGB grid bearing + 0.167°.
const GRID_CONV = 0.167;
// Axis lines through the post centre, drawn in true azimuth.
// Cunnington: the dashed line on her 1929 plan, registered to the marker posts.
// Fitted: mean of the ellipse long axes of each ring group.
const AXES = [
  { id: 'axisCun', az: 49.4, colour: 0xffffff, half: 60 },
  { id: 'axisCF', az: 43.3, colour: 0x3fd08a, half: 60 },
  { id: 'axisAB', az: 38.6, colour: 0xff8a3d, half: 60 },
];
starPoints.rotation.y = GRID_CONV * Math.PI / 180;
const axisLines = {};
function buildAxes() {
  for (const a of AXES) {
    if (axisLines[a.id]) scene.remove(axisLines[a.id]);
    const g = (a.az - GRID_CONV) * Math.PI / 180;
    const dx = Math.sin(g), dz = -Math.cos(g);
    const pts = [];
    for (let k = -a.half; k <= a.half; k += 1) {
      const x = centre.x + dx * k, z = centre.z + dz * k;
      pts.push(new THREE.Vector3(x, groundAt(x, z) + 0.12, z));
    }
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({ color: a.colour, depthTest: false, transparent: true, opacity: 0.95 }));
    line.renderOrder = 5;
    line.visible = document.getElementById(a.id).checked;
    scene.add(line);
    axisLines[a.id] = line;
  }
}
function viewFromCentre(azTrue) {
  const g = (azTrue - GRID_CONV) * Math.PI / 180;
  const y = groundY + 1.6;
  cam.position.set(centre.x - Math.sin(g) * 0.5, y, centre.z + Math.cos(g) * 0.5);
  controls.target.set(centre.x + Math.sin(g) * 40, y - 1.5, centre.z - Math.cos(g) * 40);
  controls.update();
}
function viewPlan() {
  cam.position.set(centre.x, groundY + 95, centre.z + 0.01);
  controls.target.set(centre.x, groundY, centre.z);
  controls.update();
}
document.getElementById('btnEye').onclick = () => viewFromCentre(49.4);
document.getElementById('btnTop').onclick = () => viewPlan();
for (const a of AXES) {
  document.getElementById(a.id).onchange = (ev) => { if (axisLines[a.id]) axisLines[a.id].visible = ev.target.checked; };
}

// North is local −Z, the same frame as the Stonehenge model.
// Flat arrow on the ground, tail 80 m north of the post centre, clear of the bank.
// Shape is drawn in XY with the tip at +Y; rotation.x = −π/2 lays that tip on −Z.
const nMat = new THREE.MeshBasicMaterial({
  color: 0x5ad0ff, side: THREE.FrontSide, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4,
});
const nShape = new THREE.Shape();
nShape.moveTo(-0.7, 0);
nShape.lineTo(0.7, 0);
nShape.lineTo(0.7, 13);
nShape.lineTo(2.1, 13);
nShape.lineTo(0, 18.5);
nShape.lineTo(-2.1, 13);
nShape.lineTo(-0.7, 13);
nShape.closePath();
const nArrow = new THREE.Mesh(new THREE.ShapeGeometry(nShape), nMat);
nArrow.rotation.x = -Math.PI / 2;
const nGroup = new THREE.Group();
nGroup.add(nArrow);
const nCanvas = document.createElement('canvas');
nCanvas.width = 128;
nCanvas.height = 128;
const nCtx = nCanvas.getContext('2d');
nCtx.font = 'bold 96px system-ui,sans-serif';
nCtx.textAlign = 'center';
nCtx.textBaseline = 'middle';
nCtx.fillStyle = 'rgba(0,0,0,0.55)';
nCtx.fillText('N', 66, 70);
nCtx.fillStyle = '#e8f7ff';
nCtx.fillText('N', 64, 66);
const nTex = new THREE.CanvasTexture(nCanvas);
nTex.colorSpace = THREE.SRGBColorSpace;
const nLab = new THREE.Sprite(new THREE.SpriteMaterial({ map: nTex, transparent: true, depthTest: false }));
nLab.scale.set(5.2, 5.2, 1);
nLab.position.set(0, 3.4, -22);
nGroup.add(nLab);
const NORTH_CLEAR = 80;
nGroup.position.set(centre.x, 0, centre.z - NORTH_CLEAR);
scene.add(nGroup);
const groundRay = new THREE.Raycaster();
const groundMeshes = [];
function groundAt(x, z) {
  if (!groundMeshes.length) return groundY;
  groundRay.set(new THREE.Vector3(x, 800, z), new THREE.Vector3(0, -1, 0));
  const hits = groundRay.intersectObjects(groundMeshes, false);
  return hits.length ? hits[0].point.y : groundY;
}

let groundY = 0;
let postH = 7.5;
function sampleGround(mesh) {
  const pos = mesh.geometry.attributes.position;
  let best = 1e18, y = 0;
  for (let i = 0; i < pos.count; i += 6) {
    const dx = pos.getX(i) - centre.x;
    const dz = pos.getZ(i) - centre.z;
    const d = dx * dx + dz * dz;
    if (d < best) { best = d; y = pos.getY(i); }
  }
  return y;
}
function seatPosts(y) {
  groundY = y;
  controls.target.y = y + 1.6;
  const tailZ = centre.z - NORTH_CLEAR;
  const tipZ = tailZ - 18.5;
  nGroup.position.y = Math.max(groundAt(centre.x, tailZ), groundAt(centre.x, tipZ), y) + 0.45;
  for (const mesh of posts) {
    mesh.scale.y = postH / 3;
    mesh.position.y = y + postH / 2;
  }
}
document.getElementById('postH').oninput = (ev) => {
  postH = +ev.target.value;
  document.getElementById('hLbl').textContent = postH.toFixed(1) + ' m';
  seatPosts(groundY);
};

function meshFromBlock(block) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(block.positions), 3));
  if (block.normals) geo.setAttribute('normal', new THREE.Float32BufferAttribute(new Float32Array(block.normals), 3));
  if (block.colors) geo.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(block.colors), 3));
  geo.setIndex(block.indices);
  if (!block.normals) geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide }));
  mesh.receiveShadow = true;
  return mesh;
}

const readout = document.getElementById('readout');
const sunOrigin = new THREE.Vector3(centre.x, 2, centre.z);
const SKYLINE = window.WOODHENGE_HORIZON || { alt_deg: [], step_deg: 0.25, encode: { offset: -5, span: 9 } };
const hoyleAlts = SKYLINE.alt_deg || [];
const hoyleStep = SKYLINE.step_deg || 0.25;
const ALT_OFFSET = SKYLINE.encode ? SKYLINE.encode.offset : -5;
const ALT_SPAN = SKYLINE.encode ? SKYLINE.encode.span : 9;

// Sun and moon are cut by the skyline of this landscape, measured from the Woodhenge eye.
function makeHorizonTexture(alts) {
  const n = Math.max(1, alts.length);
  const data = new Uint8Array(n * 4);
  for (let i = 0; i < alts.length; i++) {
    const v = Math.max(0, Math.min(65535, Math.round((alts[i] - ALT_OFFSET) / ALT_SPAN * 65535)));
    data[i * 4] = (v >> 8) & 255;
    data[i * 4 + 1] = v & 255;
    data[i * 4 + 3] = 255;
  }
  const tex = new THREE.DataTexture(data, n, 1);
  tex.format = THREE.RGBAFormat;
  tex.type = THREE.UnsignedByteType;
  tex.wrapS = THREE.RepeatWrapping;
  tex.minFilter = THREE.NearestFilter;
  tex.magFilter = THREE.NearestFilter;
  tex.flipY = false;
  tex.needsUpdate = true;
  return tex;
}
const horizonTex = makeHorizonTexture(hoyleAlts);
const DISC_VERT = `
  varying vec3 vWorld;
  varying float vRad;
  void main() {
    vRad = length(position.xy);
    vec4 w = modelMatrix * vec4(position, 1.0);
    vWorld = w.xyz;
    gl_Position = projectionMatrix * viewMatrix * w;
  }
`;
const DISC_FRAG = `
  precision highp float;
  varying vec3 vWorld;
  varying float vRad;
  uniform vec3 eyePos;
  uniform vec3 discCenter;
  uniform vec3 color;
  uniform sampler2D horizon;
  uniform float horizonN;
  uniform float glow;
  uniform float moonMode;
  uniform float phaseCos;
  uniform vec3 sunInDisc;
  uniform float discRadius;
  uniform float altOffset;
  uniform float altSpan;
  float skyAlt(float az) {
    float x = az / 360.0 * horizonN;
    float i = floor(x);
    float f = x - i;
    float u0 = (mod(i, horizonN) + 0.5) / horizonN;
    float u1 = (mod(i + 1.0, horizonN) + 0.5) / horizonN;
    vec4 s0 = texture2D(horizon, vec2(u0, 0.5));
    vec4 s1 = texture2D(horizon, vec2(u1, 0.5));
    float h0 = (s0.r * 255.0 * 256.0 + s0.g * 255.0) / 65535.0 * altSpan + altOffset;
    float h1 = (s1.r * 255.0 * 256.0 + s1.g * 255.0) / 65535.0 * altSpan + altOffset;
    return mix(h0, h1, f);
  }
  void main() {
    vec3 rel = vWorld - eyePos;
    float alt = degrees(atan(rel.y, length(rel.xz)));
    float az = degrees(atan(rel.x, -rel.z));
    if (az < 0.0) az += 360.0;
    if (alt < skyAlt(az)) discard;
    vec3 col = color;
    float alpha = 1.0;
    if (moonMode > 0.5) {
      float along = dot(vWorld - discCenter, sunInDisc) / max(discRadius, 0.001);
      float lit = smoothstep(-0.04, 0.04, along + phaseCos);
      col = mix(color * 0.07, color, lit);
    }
    if (glow > 0.5) {
      alpha = (1.0 - smoothstep(0.55, 1.0, vRad)) * 0.42;
      if (alpha < 0.02) discard;
    }
    gl_FragColor = vec4(col, alpha);
  }
`;
function makeClippedDisc(hex, glow) {
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      eyePos: { value: new THREE.Vector3() },
      discCenter: { value: new THREE.Vector3() },
      color: { value: new THREE.Color(hex) },
      horizon: { value: horizonTex },
      horizonN: { value: Math.max(1, hoyleAlts.length) },
      glow: { value: glow ? 1 : 0 },

  if (dayOver > 0) ut += ' +' + dayOver + 'd';

function placeBody(body, altDeg, azDeg, date) {
  const az = THREE.MathUtils.degToRad(azDeg - GRID_CONV);

  const eye = new THREE.Vector3(centre.x, groundY + 1.6, centre.z);
  const flat = { x: Math.sin(az), z: -Math.cos(az) };
  const dist = distPastTerrain(eye, flat.x, flat.z);
  const pos = new THREE.Vector3(
    eye.x + flat.x * dist,
    eye.y + Math.tan(alt) * dist,
    eye.z + flat.z * dist,
  );
  const up = altDeg > -0.4;
  const moonNow = body === 'Moon';
  sunLight.color.setHex(moonNow ? 0xc8d0dc : 0xffe2a8);
  sunLight.intensity = up ? (moonNow ? 0.55 : 1.35) : 0.08;
  sunLight.position.copy(eye).addScaledVector(dir, 420);
  sunLight.target.position.copy(eye);
  sunLight.target.updateMatrixWorld();
  const sd = Sky.sdFor(body);
  const radius = Math.max(0.5, dist * Math.tan(sd * Math.PI / 180));
  let phaseCos = 1;
  if (moonNow && date) {
    try { phaseCos = Math.cos(Sky.moonPhase(date).phaseAngle * Math.PI / 180); } catch (e) { phaseCos = 1; }
  }

    mesh.visible = true;
    mesh.position.copy(pos);
    mesh.scale.setScalar(radius * (isGlow ? 1.45 : 1));
    mesh.lookAt(eye);
    mesh.material.uniforms.eyePos.value.copy(eye);
    mesh.material.uniforms.discCenter.value.copy(pos);
    mesh.material.uniforms.discRadius.value = radius;
    mesh.material.uniforms.moonMode.value = moonNow ? 1 : 0;
    mesh.material.uniforms.phaseCos.value = phaseCos;
  }
  sunDisc.visible = false;
  sunGlow.visible = false;
  moonDisc.visible = false;
  const disc = moonNow ? moonDisc : sunDisc;
  seatDisc(disc, false);
  if (!moonNow) seatDisc(sunGlow, true);
  if (moonNow) {
    const sunApp = Sky.horizontal('Sun', date, true);
    const sr = (sunApp.az - GRID_CONV) * Math.PI / 180;
    const sa = sunApp.alt * Math.PI / 180;
    const sunVec = new THREE.Vector3(Math.sin(sr) * Math.cos(sa), Math.sin(sa), -Math.cos(sr) * Math.cos(sa));

    if (axis.lengthSq() < 1e-8) axis.set(1, 0, 0);

}

function updateStars() {

  const cat = window.BRIGHT_STARS;
  if (!starsOn || !cat) {
    starPoints.visible = false;
    if (note) note.textContent = '';

  }
  const key = epochYear + ':' + doy + ':' + Math.round(minuteUt);
  starPoints.visible = true;
  let sunAlt = -10;
  try {
    sunAlt = Sky.horizontal('Sun', Sky.dateFromDoyMinute(epochYear, doy, minuteUt), true).alt;
  } catch (e) { /* keep the last night value */ }
  starMat.uniforms.sunAlt.value = sunAlt;
  if (key === starKey && starGeo.getAttribute('position')) {
    if (note) writeStarNote(note, cat);

  }
  starKey = key;
  const rows = starsAbove(cat.s, epochYear, doy, minuteUt, -0.4);

// Smooth bank and ditch, with the entrance open just east of north.
// Heights are a clean contour, not the rough 1 m survey.
function addEarthwork(y0) {
  const r0 = 26, r1 = 66;
  const nr = 34, na = 180;
  const positions = [];
  const colors = [];
  // Distance to a circular bank or ditch that stops at the entrance.
  // The stop is a round end, so the contour does not run out to a point.
  function distToArc(r, azDeg, radius) {
    const gap0 = 6, gap1 = 38;
    let clamped = azDeg;
    if (azDeg >= gap0 && azDeg <= gap1) {
      clamped = (azDeg - gap0) < (gap1 - azDeg) ? gap0 : gap1;
    }
    const az = azDeg * Math.PI / 180;
    const ca = clamped * Math.PI / 180;
    const dx = r * Math.sin(az) - radius * Math.sin(ca);
    const dn = r * Math.cos(az) - radius * Math.cos(ca);
    return Math.hypot(dx, dn);
  }
  function relief(r, azDeg) {
    const ditch = Math.exp(-0.5 * (distToArc(r, azDeg, 33) / 3.2) ** 2);
    const bank = Math.exp(-0.5 * (distToArc(r, azDeg, 46) / 5.2) ** 2);
    return -0.6 * ditch + 0.95 * bank;
  }
  for (let ia = 0; ia < na; ia++) {
    const az = ia * (360 / na);
    const rad = az * Math.PI / 180;
    for (let ir = 0; ir < nr; ir++) {
      const r = r0 + ir * (r1 - r0) / (nr - 1);
      const h = relief(r, az);
      positions.push(centre.x + Math.sin(rad) * r, y0 + h, centre.z - Math.cos(rad) * r);
      const s = 0.78 + 0.5 * h;
      colors.push(0.40 * s, 0.48 * s, 0.28 * s);
    }
  }
  const indices = [];
  for (let ia = 0; ia < na; ia++) {
    const ib = (ia + 1) % na;
    for (let ir = 0; ir < nr - 1; ir++) {
      const a = ia * nr + ir;
      const b = ib * nr + ir;
      const c = a + 1;
      const d = b + 1;
      indices.push(a, c, b, b, c, d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({
    vertexColors: true,
    side: THREE.DoubleSide,
    polygonOffset: true,
    polygonOffsetFactor: -2,
    polygonOffsetUnits: -2,
  }));
  mesh.receiveShadow = true;
  mesh.renderOrder = 1;
  scene.add(mesh);
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error(src));
    document.head.appendChild(s);
  });
}
